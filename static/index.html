<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hangman</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Hangman</h1>

    <form id="new-game" class="controls">
      <label for="difficulty">Difficulty</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
      <button type="submit">New Game</button>
    </form>

    <svg id="gallows" viewBox="0 0 200 220" role="img" aria-label="Hangman drawing">
      <g class="frame">
        <line x1="20" y1="210" x2="140" y2="210"/>
        <line x1="50" y1="210" x2="50" y2="20"/>
        <line x1="50" y1="20" x2="130" y2="20"/>
        <line x1="130" y1="20" x2="130" y2="45"/>
      </g>
      <g class="body">
        <circle cx="130" cy="65" r="20"/>
        <line x1="130" y1="85" x2="130" y2="140"/>
        <line x1="130" y1="100" x2="105" y2="125"/>
        <line x1="130" y1="100" x2="155" y2="125"/>
        <line x1="130" y1="140" x2="110" y2="180"/>
        <line x1="130" y1="140" x2="150" y2="180"/>
      </g>
    </svg>

    <p id="pattern" class="pattern" aria-live="polite"></p>

    <dl class="stats">
      <div><dt>Remaining</dt><dd id="remaining">-</dd></div>
      <div><dt>Guessed</dt><dd id="guessed">-</dd></div>
      <div><dt>Wrong</dt><dd id="incorrect">-</dd></div>
    </dl>

    <p id="message" class="message" role="status"></p>

    <div id="keyboard" class="keyboard"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
